<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بيبي مون | متجر ملابس الأطفال</title>
  <meta name="description" content="بيبي مون - أفضل متجر لملابس الأطفال في العراق. ولادي وبناتي بأرقى التصاميم وأجمل الألوان." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>

<body>

  <!-- ========== FIXED HEADER ========== -->
  <header class="header" id="mainHeader">
    <button class="header-icon-btn" id="searchBtn" onclick="toggleSearch()" title="بحث">
      🔍
    </button>
    <div class="logo-wrapper" id="storeLogo" title="اضغط مطولاً للدخول إلى لوحة التحكم">
      <span class="logo-moon">🌙</span>
      <span class="store-name">بيبي مون</span>
    </div>
    <button class="header-icon-btn cart-btn" id="cartBtn" onclick="toggleCart()">
      🛒 <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </header>

  <!-- ========== SEARCH OVERLAY ========== -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-bar-wrap">
      <input type="text" id="searchInput" class="search-input-hero" placeholder="ابحث عن منتج..." autofocus />
      <button class="search-close-btn" onclick="toggleSearch()">✕</button>
    </div>
    <div class="search-results-overlay" id="searchResultsOverlay"></div>
  </div>

  <!-- ========== HERO BANNER SLIDER ========== -->
  <section class="hero-slider" id="heroSlider">
    <div class="slider-track" id="sliderTrack">
      <!-- Slides injected by JS -->
    </div>
    <div class="slider-dots" id="sliderDots"></div>
    <button class="slider-arrow slider-prev" id="sliderPrev" onclick="slidePrev()" aria-label="السابق">❯</button>
    <button class="slider-arrow slider-next" id="sliderNext" onclick="slideNext()" aria-label="التالي">❮</button>
  </section>

  <!-- ========== CATEGORY TABS ========== -->
  <nav class="cat-tabs" id="catTabs">
    <div class="cat-tabs-row" id="catTabsRow">
      <!-- Injected dynamically -->
    </div>
  </nav>

  <!-- ========== MAIN APP AREA (SPA router) ========== -->
  <main class="app-main" id="appMain">
    <!-- Content rendered by router -->
  </main>

  <!-- ========== CART SIDEBAR ========== -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h2>🛒 سلة المشتريات</h2>
      <button class="cart-close" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-empty" id="cartEmpty">
      <div style="font-size:3rem;">🛒</div>
      <p>السلة فارغة</p>
    </div>
    <!-- cart-footer: scrollable form area -->
    <div class="cart-footer" id="cartFooter" style="display:none;">
      <div class="cart-total">
        <span>المجموع:</span>
        <span class="cart-total-amount" id="cartTotal">0 دينار</span>
      </div>
      <div class="checkout-form">
        <h3>📦 بيانات التوصيل</h3>
        <input type="text" id="custName" class="form-input" placeholder="الاسم الكامل *" required />
        <input type="text" id="custAddress" class="form-input" placeholder="العنوان التفصيلي" />
        <input type="tel" id="custPhone" class="form-input" placeholder="رقم الهاتف (واتساب) *" required />
      </div>
    </div>
    <!-- buy button: always sticky at very bottom -->
    <div class="cart-buy-bar" id="cartBuyBar" style="display:none;">
      <button class="checkout-btn" onclick="placeOrder()">
        🛍️ اشتري الآن
      </button>
    </div>
  </aside>

  <!-- ========== PRODUCT DETAIL VIEW ========== -->
  <div class="product-detail-overlay" id="productDetailOverlay" onclick="closeProductDetails()"></div>
  <div class="product-detail-view" id="productDetailView">
    <button class="detail-close" onclick="closeProductDetails()">✕</button>
    <div class="detail-content">
      <div class="detail-img-side">
        <img id="detailImg" src="" alt="" />
      </div>
      <div class="detail-info-side">
        <div id="detailBadge" class="detail-badge"></div>
        <h2 id="detailName" class="detail-name"></h2>
        <div id="detailCategory" class="detail-category"></div>
        <p id="detailDesc" class="detail-desc"></p>
        <div class="detail-price-box">
          <div id="detailPriceOriginal" class="detail-price-old"></div>
          <div id="detailPriceFinal" class="detail-price-new"></div>
        </div>
        <div class="detail-actions">
          <button id="detailBuyBtn" class="detail-buy-btn" onclick="">🛒 إضافة إلى السلة</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== ADMIN LOGIN MODAL ========== -->
  <div class="modal-overlay" id="adminModalOverlay" onclick="closeAdminModal()"></div>
  <div class="modal" id="adminModal">
    <div class="modal-header">
      <h3>🔐 لوحة التحكم</h3>
      <button onclick="closeAdminModal()" class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint">أدخل كلمة المرور للدخول إلى لوحة التحكم</p>
      <input type="password" id="adminPasswordInput" class="form-input" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter') submitAdminLogin()" />
      <div class="modal-error" id="adminError" style="display:none;"></div>
      <button class="checkout-btn" onclick="submitAdminLogin()">دخول</button>
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div class="toast" id="toast"></div>
  <!-- Long-press progress -->
  <div class="press-indicator" id="pressIndicator">
    <div class="press-ring" id="pressRing"></div>
    <span>استمر بالضغط...</span>
  </div>

  <footer class="footer">
    <p>© 2024 بيبي مون | جميع الحقوق محفوظة 💙</p>
  </footer>

  <script src="/js/main.js"></script>
</body>

</html>
